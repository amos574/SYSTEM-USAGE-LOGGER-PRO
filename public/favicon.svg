<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle matching the Navbar icon container (w-10 h-10 rounded-xl bg-blue-600) -->
  <rect width="64" height="64" rx="16" fill="url(#blueGrad)" />
  
  <!-- Lucide Cpu icon paths centered -->
  <!-- Outer chip boundary -->
  <rect x="18" y="18" width="28" height="28" rx="4" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Inner core -->
  <rect x="25" y="25" width="14" height="14" rx="2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#3B82F6" />
  
  <!-- Top pins -->
  <line x1="26" y1="8" x2="26" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="38" y1="8" x2="38" y2="18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- Bottom pins -->
  <line x1="26" y1="46" x2="26" y2="56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="38" y1="46" x2="38" y2="56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- Left pins -->
  <line x1="8" y1="26" x2="18" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="8" y1="38" x2="18" y2="38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- Right pins -->
  <line x1="46" y1="26" x2="56" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <line x1="46" y1="38" x2="56" y2="38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
</svg>
